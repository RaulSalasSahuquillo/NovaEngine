<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="480">
  <defs>
    <!-- Background styling -->
    <radialGradient id="archGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#0052cc" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="archDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.45" />
    </pattern>

    <!-- Linear gradients for conduit lines and packets -->
    <linearGradient id="conduitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Card headers and highlights -->
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="coreCardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0052cc" stop-opacity="0.8" />
    </linearGradient>

    <style>
      @keyframes packetMove1 {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .conduit-flow {
        stroke-dasharray: 8 16;
        animation: packetMove1 2s linear infinite;
      }
      .beacon-active {
        animation: beaconBlink 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Obsidian Canvas -->
  <rect width="1200" height="480" fill="#000000" rx="16" />
  <rect width="1200" height="480" fill="url(#archDots)" rx="16" />
  <rect width="1200" height="480" fill="url(#archGlow)" rx="16" />
  <rect width="1198" height="478" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="1" rx="15" stroke-opacity="0.8" />

  <!-- Technical Schematic Header -->
  <g transform="translate(48, 36)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8" class="beacon-active" />
    <text x="20" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="2">TOPOLOGICAL ARCHITECTURE</text>
    <text x="20" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">DECOUPLED EXECUTION RUNTIME // DUAL DART &amp; PYTHON KERNEL</text>
  </g>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(980, 36)">
    <rect x="0" y="-4" width="172" height="24" rx="12" fill="#03182e" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="8" r="3.5" fill="#38bdf8" class="beacon-active" />
    <text x="26" y="12" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">HEADLESS ENGINE</text>
  </g>

  <!-- ============================================================ -->
  <!-- CONDUIT BUS CONNECTIONS (STREAM SIGNAL PATHWAYS)             -->
  <!-- ============================================================ -->
  <g stroke="#1e293b" stroke-width="1.5" fill="none">
    <!-- Feeds to FX Normalizer -->
    <path d="M 260 160 H 320 V 210 H 380" />
    <path d="M 260 270 H 320 V 210 H 380" />

    <!-- FX to Processing Core -->
    <path d="M 540 210 H 580" />

    <!-- Core to Tax Auditor -->
    <path d="M 710 300 V 340" />

    <!-- Core to Storage & Interfaces -->
    <path d="M 840 210 H 900 V 160 H 940" />
    <path d="M 840 210 H 900 V 270 H 940" />
  </g>

  <!-- Animated Signal Pulses over Conduits -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" class="conduit-flow">
    <path d="M 260 160 H 320 V 210 H 380" />
    <path d="M 260 270 H 320 V 210 H 380" />
    <path d="M 540 210 H 580" />
    <path d="M 710 300 V 340" />
    <path d="M 840 210 H 900 V 160 H 940" />
    <path d="M 840 210 H 900 V 270 H 940" />
  </g>

  <!-- ============================================================ -->
  <!-- COLUMN 1: MARKET INGESTION SUBSYSTEM (LEFT)                  -->
  <!-- ============================================================ -->
  <!-- Node A: Yahoo Finance -->
  <g transform="translate(48, 120)">
    <rect width="212" height="80" rx="8" fill="#030712" stroke="url(#cardStroke)" stroke-width="1" />
    <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">FEED // EQUITIES</text>
    <text x="16" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">Yahoo Finance</text>
    <text x="16" y="66" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Stocks, ETFs · 10s TTL</text>
    <circle cx="192" cy="24" r="3" fill="#38bdf8" />
  </g>

  <!-- Node B: CoinGecko -->
  <g transform="translate(48, 230)">
    <rect width="212" height="80" rx="8" fill="#030712" stroke="url(#cardStroke)" stroke-width="1" />
    <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">FEED // CRYPTO</text>
    <text x="16" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">CoinGecko Spot</text>
    <text x="16" y="66" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Coins, Market Caps · TTL</text>
    <circle cx="192" cy="24" r="3" fill="#38bdf8" />
  </g>

  <!-- ============================================================ -->
  <!-- COLUMN 2: FX HARMONIZATION NODE                              -->
  <!-- ============================================================ -->
  <g transform="translate(380, 160)">
    <rect width="160" height="100" rx="8" fill="#040a17" stroke="#0284c7" stroke-width="1.2" />
    <text x="14" y="26" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">HARMONIZER</text>
    <text x="14" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">FX Rate Matrix</text>
    <text x="14" y="68" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CANONICAL EUR</text>
    <text x="14" y="86" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">10 Fiat Cross-Pairs</text>
  </g>

  <!-- ============================================================ -->
  <!-- COLUMN 3: CORE RUNTIME ENGINE (CENTERPIECE)                  -->
  <!-- ============================================================ -->
  <g transform="translate(580, 120)">
    <!-- Elevated Core Card -->
    <rect width="260" height="180" rx="10" fill="#030a1c" stroke="url(#coreCardStroke)" stroke-width="1.5" />
    
    <!-- Header -->
    <text x="20" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">CORE RUNTIME ENGINE</text>
    <line x1="20" y1="42" x2="240" y2="42" stroke="#0c284d" stroke-width="1" />

    <!-- Pillar 1: Solvency Gate -->
    <g transform="translate(20, 64)">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
      <text x="16" y="7" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">Solvency Assertion Gate</text>
      <text x="16" y="22" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Zero-deficit balance verification</text>
    </g>

    <!-- Pillar 2: Cost Basis Accounting -->
    <g transform="translate(20, 104)">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
      <text x="16" y="7" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">Weighted Average Cost</text>
      <text x="16" y="22" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Dynamic position adjustments</text>
    </g>

    <!-- Pillar 3: Order Lifecycle -->
    <g transform="translate(20, 144)">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
      <text x="16" y="7" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">Settlement Coordinator</text>
      <text x="16" y="22" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Atomic receipts &amp; audit commit</text>
    </g>
  </g>

  <!-- Attached Bottom Node: Fiscal Tax Auditor -->
  <g transform="translate(580, 340)">
    <rect width="260" height="88" rx="8" fill="#030712" stroke="url(#cardStroke)" stroke-width="1" />
    <text x="18" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">STATUTORY FISCAL AUDITOR</text>
    <text x="18" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">11+ National Tax Regimes</text>
    <text x="18" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Spain IRPF / Tobin · SEC 31 · SDRT · TTF</text>
    <circle cx="238" cy="22" r="3" fill="#38bdf8" />
  </g>

  <!-- ============================================================ -->
  <!-- COLUMN 4: PERSISTENCE & CLIENT RUNTIMES (RIGHT)              -->
  <!-- ============================================================ -->
  <!-- Node A: Persistence Engine -->
  <g transform="translate(940, 120)">
    <rect width="212" height="80" rx="8" fill="#030712" stroke="url(#cardStroke)" stroke-width="1" />
    <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">PERSISTENCE LAYER</text>
    <text x="16" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">Atomic JSON &amp; SQLite</text>
    <text x="16" y="66" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Temp-swap I/O · ACID ledger</text>
    <circle cx="192" cy="24" r="3" fill="#38bdf8" />
  </g>

  <!-- Node B: Host Language Drivers -->
  <g transform="translate(940, 230)">
    <rect width="212" height="80" rx="8" fill="#030712" stroke="url(#cardStroke)" stroke-width="1" />
    <text x="16" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">POLYGLOT RUNTIMES</text>
    <text x="16" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600">Pure Dart &amp; Python</text>
    <text x="16" y="66" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Library APIs + Native CLIs</text>
    <circle cx="192" cy="24" r="3" fill="#38bdf8" />
  </g>
</svg>