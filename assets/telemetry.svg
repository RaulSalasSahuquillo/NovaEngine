<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="150">
  <defs>
    <radialGradient id="telGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="telDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.45" />
    </pattern>
    <linearGradient id="telStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Obsidian Background -->
  <rect width="1200" height="150" fill="#000000" rx="16" />
  <rect width="1200" height="150" fill="url(#telDots)" rx="16" />
  <rect width="1200" height="150" fill="url(#telGlow)" rx="16" />
  <rect width="1198" height="148" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="1" rx="15" stroke-opacity="0.8" />

  <!-- Metric 1: Jurisdictions -->
  <g transform="translate(48, 25)">
    <rect width="252" height="100" rx="8" fill="#030712" stroke="url(#telStroke)" stroke-width="1" />
    <circle cx="20" cy="24" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">FISCAL ENGINE</text>
    <text x="20" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="26" font-weight="800" letter-spacing="-1">11+</text>
    <text x="68" y="62" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">Tax Regimes</text>
    <text x="20" y="86" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">Spain IRPF, Tobin, SEC, TTF</text>
  </g>

  <!-- Metric 2: Currencies -->
  <g transform="translate(328, 25)">
    <rect width="252" height="100" rx="8" fill="#030712" stroke="url(#telStroke)" stroke-width="1" />
    <circle cx="20" cy="24" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">FX HARMONIZATION</text>
    <text x="20" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="26" font-weight="800" letter-spacing="-1">10</text>
    <text x="56" y="62" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">Fiat Currencies</text>
    <text x="20" y="86" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">Canonical EUR base anchor</text>
  </g>

  <!-- Metric 3: Dual Runtimes -->
  <g transform="translate(608, 25)">
    <rect width="252" height="100" rx="8" fill="#030712" stroke="url(#telStroke)" stroke-width="1" />
    <circle cx="20" cy="24" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">DUAL RUNTIME</text>
    <text x="20" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="26" font-weight="800" letter-spacing="-1">2x</text>
    <text x="60" y="62" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">Native Kernels</text>
    <text x="20" y="86" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">Pure Dart 3.0+ &amp; Python 3.9+</text>
  </g>

  <!-- Metric 4: Zero GUI -->
  <g transform="translate(888, 25)">
    <rect width="264" height="100" rx="8" fill="#030712" stroke="url(#telStroke)" stroke-width="1" />
    <circle cx="20" cy="24" r="3.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">ARCHITECTURE</text>
    <text x="20" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="26" font-weight="800" letter-spacing="-1">0</text>
    <text x="42" y="62" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">GUI Dependencies</text>
    <text x="20" y="86" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">Microsecond quantitative core</text>
  </g>
</svg>