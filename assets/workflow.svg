<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <style>
      @keyframes flowMove {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .pipeline-signal {
        stroke-dasharray: 6 10;
        animation: flowMove 1.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Clean dark background -->
  <rect width="1000" height="240" fill="#000000" rx="12"/>

  <!-- Minimal Header -->
  <g transform="translate(48, 36)">
    <circle cx="5" cy="5" r="3.5" fill="#38bdf8"/>
    <text x="18" y="9" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">EXECUTION LIFECYCLE</text>
    <text x="18" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">Deterministic pipeline from order submission to immutable ledger settlement.</text>
  </g>

  <!-- ============================================================ -->
  <!-- HORIZONTAL TIMELINE TRACK                                    -->
  <!-- ============================================================ -->
  <g transform="translate(0, 115)">
    <!-- Base track line -->
    <line x1="80" y1="0" x2="905" y2="0" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Animated signal flow -->
    <line x1="80" y1="0" x2="905" y2="0" stroke="#38bdf8" stroke-width="1.5" class="pipeline-signal"/>
    
    <!-- End Arrowhead -->
    <polygon points="905,-4 915,0 905,4" fill="#38bdf8"/>
  </g>

  <!-- ============================================================ -->
  <!-- 5 PIPELINE STAGES                                            -->
  <!-- ============================================================ -->

  <!-- STAGE 1: ORDER INTENT -->
  <g transform="translate(80, 0)">
    <!-- Stage number -->
    <text x="0" y="95" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">01</text>
    <!-- Node circle -->
    <circle cx="0" cy="115" r="5" fill="#0284c7"/>
    <circle cx="0" cy="115" r="2" fill="#ffffff"/>
    <!-- Label -->
    <text x="0" y="142" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Order Intent</text>
    <text x="0" y="158" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Quote &amp; volume</text>
    <text x="0" y="172" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">Input validation</text>
  </g>

  <!-- STAGE 2: FX ALIGNMENT -->
  <g transform="translate(285, 0)">
    <text x="0" y="95" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">02</text>
    <circle cx="0" cy="115" r="5" fill="#0284c7"/>
    <circle cx="0" cy="115" r="2" fill="#ffffff"/>
    <text x="0" y="142" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FX Alignment</text>
    <text x="0" y="158" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">EUR base anchor</text>
    <text x="0" y="172" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">Normalized price</text>
  </g>

  <!-- STAGE 3: FISCAL AUDIT -->
  <g transform="translate(490, 0)">
    <text x="0" y="95" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">03</text>
    <circle cx="0" cy="115" r="5" fill="#38bdf8"/>
    <circle cx="0" cy="115" r="2" fill="#ffffff"/>
    <text x="0" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Fiscal Audit</text>
    <text x="0" y="158" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Taxes &amp; broker fees</text>
    <text x="0" y="172" fill="#0284c7" font-family="monospace" font-size="10" text-anchor="middle">11+ jurisdiction rules</text>
  </g>

  <!-- STAGE 4: SOLVENCY GATE -->
  <g transform="translate(695, 0)">
    <text x="0" y="95" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">04</text>
    <circle cx="0" cy="115" r="5" fill="#0284c7"/>
    <circle cx="0" cy="115" r="2" fill="#ffffff"/>
    <text x="0" y="142" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Solvency Gate</text>
    <text x="0" y="158" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Cash reserve check</text>
    <text x="0" y="172" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">Zero deficit assertion</text>
  </g>

  <!-- STAGE 5: SETTLEMENT -->
  <g transform="translate(900, 0)">
    <text x="0" y="95" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">05</text>
    <circle cx="0" cy="115" r="5" fill="#0284c7"/>
    <circle cx="0" cy="115" r="2" fill="#ffffff"/>
    <text x="0" y="142" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Settlement</text>
    <text x="0" y="158" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Cost basis &amp; UUID</text>
    <text x="0" y="172" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">Ledger committed</text>
  </g>
</svg>
