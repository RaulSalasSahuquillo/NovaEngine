<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260">
  <defs>
    <!-- Background styling -->
    <radialGradient id="wfGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#0052cc" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="wfDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.45" />
    </pattern>

    <linearGradient id="wfTrackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="20%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="nodeCardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <style>
      @keyframes photonPulse {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blinkNode {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .track-stream {
        stroke-dasharray: 8 16;
        animation: photonPulse 2.2s linear infinite;
      }
      .node-beacon {
        animation: blinkNode 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Obsidian Canvas -->
  <rect width="1200" height="260" fill="#000000" rx="16" />
  <rect width="1200" height="260" fill="url(#wfDots)" rx="16" />
  <rect width="1200" height="260" fill="url(#wfGlow)" rx="16" />
  <rect width="1198" height="258" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="1" rx="15" stroke-opacity="0.8" />

  <!-- Technical Schematic Header -->
  <g transform="translate(48, 30)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8" class="node-beacon" />
    <text x="20" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="2">TRANSACTION LIFECYCLE PIPELINE</text>
    <text x="20" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">SUB-MILLISECOND DETERMINISTIC STATE MACHINE // 5-STAGE VALIDATION &amp; SETTLEMENT</text>
  </g>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(1000, 30)">
    <rect x="0" y="-4" width="152" height="24" rx="12" fill="#03182e" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="8" r="3.5" fill="#38bdf8" class="node-beacon" />
    <text x="26" y="12" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">ACID SETTLEMENT</text>
  </g>

  <!-- ============================================================ -->
  <!-- HORIZONTAL INTERCONNECTING TRACK                             -->
  <!-- ============================================================ -->
  <g transform="translate(0, 160)">
    <line x1="80" y1="0" x2="1120" y2="0" stroke="#1e293b" stroke-width="1.5" />
    <line x1="80" y1="0" x2="1120" y2="0" stroke="#38bdf8" stroke-width="2" class="track-stream" />
  </g>

  <!-- ============================================================ -->
  <!-- 5 STAGE CARDS                                                -->
  <!-- ============================================================ -->

  <!-- STAGE 1: INTENT -->
  <g transform="translate(48, 85)">
    <rect width="204" height="145" rx="8" fill="#030712" stroke="url(#nodeCardStroke)" stroke-width="1" />
    <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">01 / INTENT</text>
    <text x="16" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">Order Intent</text>
    <text x="16" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11">Quote &amp; volume audit</text>
    <line x1="16" y1="76" x2="188" y2="76" stroke="#0f172a" stroke-width="1" />
    <!-- Telemetry Badges -->
    <text x="16" y="98" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">SYMBOL LOOKUP</text>
    <text x="16" y="114" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">POSITIVE VOLUME</text>
    <circle cx="184" cy="22" r="3" fill="#38bdf8" />
  </g>

  <!-- STAGE 2: HARMONIZE -->
  <g transform="translate(276, 85)">
    <rect width="204" height="145" rx="8" fill="#030712" stroke="url(#nodeCardStroke)" stroke-width="1" />
    <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">02 / HARMONIZE</text>
    <text x="16" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">FX Alignment</text>
    <text x="16" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11">EUR base anchor</text>
    <line x1="16" y1="76" x2="188" y2="76" stroke="#0f172a" stroke-width="1" />
    <text x="16" y="98" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">CROSS-RATE MATRIX</text>
    <text x="16" y="114" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">ZERO FX DRIFT</text>
    <circle cx="184" cy="22" r="3" fill="#38bdf8" />
  </g>

  <!-- STAGE 3: AUDIT (ACCENTED) -->
  <g transform="translate(504, 85)">
    <rect width="204" height="145" rx="8" fill="#040c1e" stroke="#0284c7" stroke-width="1.5" />
    <text x="16" y="24" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">03 / AUDIT</text>
    <text x="16" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700">Fiscal Auditor</text>
    <text x="16" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11">11+ statutory duties</text>
    <line x1="16" y1="76" x2="188" y2="76" stroke="#0c2a4d" stroke-width="1" />
    <text x="16" y="98" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">TOBIN &amp; TTF TAX</text>
    <text x="16" y="114" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">IRPF PROGRESSIVE</text>
    <circle cx="184" cy="22" r="3" fill="#38bdf8" />
  </g>

  <!-- STAGE 4: ASSERT -->
  <g transform="translate(732, 85)">
    <rect width="204" height="145" rx="8" fill="#030712" stroke="url(#nodeCardStroke)" stroke-width="1" />
    <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">04 / ASSERT</text>
    <text x="16" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">Solvency Gate</text>
    <text x="16" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11">Cash reserve check</text>
    <line x1="16" y1="76" x2="188" y2="76" stroke="#0f172a" stroke-width="1" />
    <text x="16" y="98" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">ZERO DEFICIT GATE</text>
    <text x="16" y="114" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">HARD CASH GUARD</text>
    <circle cx="184" cy="22" r="3" fill="#38bdf8" />
  </g>

  <!-- STAGE 5: COMMIT -->
  <g transform="translate(960, 85)">
    <rect width="192" height="145" rx="8" fill="#030712" stroke="url(#nodeCardStroke)" stroke-width="1" />
    <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5">05 / COMMIT</text>
    <text x="16" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600">Settlement</text>
    <text x="16" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11">Ledger committed</text>
    <line x1="16" y1="76" x2="176" y2="76" stroke="#0f172a" stroke-width="1" />
    <text x="16" y="98" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5">AVG COST BASIS</text>
    <text x="16" y="114" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">UUID RECEIPT</text>
    <circle cx="172" cy="22" r="3" fill="#38bdf8" />
  </g>
</svg>